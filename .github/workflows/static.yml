# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Pages artifact
        run: |
          set -euo pipefail
          test -f index.html
          test -f 404.html
          test -f assets/css/style.css
          test -f assets/js/main.js
          test -f favicon.svg

          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          required = [
              root / 'index.html',
              root / '404.html',
              root / 'assets' / 'css' / 'style.css',
              root / 'assets' / 'js' / 'main.js',
              root / 'favicon.svg',
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'Missing required site artifacts: {missing}')

          html = (root / 'index.html').read_text(encoding='utf-8')
          required_refs = [
              'href="assets/css/style.css"',
              'src="assets/js/main.js"',
              'href="favicon.svg"',
          ]
          missing_refs = [ref for ref in required_refs if ref not in html]
          if missing_refs:
              raise SystemExit(f'Index.html missing required asset references: {missing_refs}')

          print('GitHub Pages artifact validation passed.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository root; GitHub Pages serves the resulting static site.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
